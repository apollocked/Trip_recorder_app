name: animations_in_flutter
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  ipsum: ^1.0.1

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  permission_handler: ^11.3.1
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0

  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  fl_chart: ^1.2.0
  share_plus: ^13.1.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  go_router: ^14.0.0
  flutter_dotenv: ^5.2.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/.env

  fonts:
    - family: xoshnus
      fonts:
        - asset: assets/fonts/xoshnus.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"

  adaptive_icon_background: "#FFFFFF"
